# ---------------------------------------------------------------------------
# FONTI SCARTATE (mostrate nella pagina, sezione crediti). Aggiornare se cambiano i termini.
# ---------------------------------------------------------------------------
discarded_sources:
  - {name: "Yahoo Finance / yfinance", reason: "robots.txt di query1/query2.finance.yahoo.com: «Disallow: /» per tutti i programmi automatici."}
  - {name: "Stooq", reason: "robots.txt «Disallow: /» per i programmi automatici e verifica anti-bot in JavaScript."}
  - {name: "FRED – S&P 500, Dow Jones, Nasdaq 100", reason: "Serie «Copyrighted: Pre-Approval Required»: riproduzione vietata senza permesso."}
  - {name: "FRED – Nikkei 225", reason: "La ridistribuzione a terzi richiede il permesso di Nikkei Inc."}
  - {name: "FRED – Bitcoin (Coinbase)", reason: "Coinbase vieta la riproduzione dei dati in qualsiasi forma."}
  - {name: "BCE – Euribor e Euro Stoxx 50", reason: "Dati di fornitori terzi (Refinitiv, DataStream): la politica di riuso BCE esclude i dati di terzi senza permesso."}
  - {name: "CoinGecko API", reason: "robots.txt vieta /api/v3."}
  - {name: "Feed RSS Banca d'Italia", reason: "I feed stanno sotto /util/, che il robots.txt di bancaditalia.it vieta."}
  - {name: "Feed YouTube videos.xml", reason: "Il robots.txt di YouTube vieta /feeds/videos.xml: si usa l'API pubblica oEmbed."}
  - {name: "COVIP e CONSOB (feed)", reason: "Nessun feed RSS ufficiale trovato: solo link al sito."}
  - {name: "Class CNBC / Milano Finanza (YouTube)", reason: "Nessun canale YouTube ufficiale verificabile trovato."}
