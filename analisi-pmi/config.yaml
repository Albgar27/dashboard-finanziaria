# Analisi PMI – parametri modificabili senza toccare il codice.
# Dopo una modifica basta ricaricare la pagina (il server rilegge il file a ogni analisi).

server:
  porta: 8800
  ollama:                      # facoltativo: "Riscrivi nel mio stile" nel report
    attivo: true
    indirizzo: "http://127.0.0.1:11434"
    modello: "gemma3:12b"
    timeout: 600
    stile: "../stile_alberto.md"

# Soglie del semaforo degli indici: sono indicazioni di massima, non regole di settore.
# verde/giallo: il valore è verde se "migliore o uguale" a verde, giallo fino a giallo, rosso oltre.
soglie:
  liquidita_corrente:   {verde: 1.2,  giallo: 1.0}
  liquidita_immediata:  {verde: 1.0,  giallo: 0.7}
  indipendenza_finanziaria: {verde: 0.30, giallo: 0.15}
  pfn_ebitda:           {verde: 3.0,  giallo: 5.0}    # più basso è meglio
  pfn_pn:               {verde: 1.0,  giallo: 2.0}    # più basso è meglio
  copertura_oneri:      {verde: 5.0,  giallo: 2.0}
  oneri_su_ricavi:      {verde: 0.02, giallo: 0.04}   # più basso è meglio
  ebitda_margin:        {verde: 0.10, giallo: 0.05}
  ros:                  {verde: 0.05, giallo: 0.0}
  roe:                  {verde: 0.08, giallo: 0.0}
  dso:                  {verde: 60,   giallo: 90}     # giorni, più basso è meglio
  tfr_su_liquidita:     {verde: 0.5,  giallo: 1.0}    # più basso è meglio
  altman_z:             {verde: 2.6,  giallo: 1.1}

# Ipotesi predefinite della proiezione TFR (modificabili per ogni azienda nella pagina TFR)
tfr:
  inflazione: 0.02             # per la rivalutazione: 1,5% + 75% dell'inflazione
  crescita_retribuzioni: 0.02
  turnover: 0.05               # probabilità annua di uscita (dimissioni, licenziamenti)
  anticipi: 0.02               # quota annua di chi ha almeno 8 anni di anzianità e chiede l'anticipo
  quota_anticipo: 0.70         # massimo di legge: 70% del TFR maturato
  eta_pensione: 67
  orizzonte: 10
  rendimento_polizza: 0.025    # netto, ipotesi
  stress_persone: 3            # scenario: escono subito le N persone con il TFR più alto
  anni_medi_pensione: 15       # solo per la stima senza elenco dipendenti

# Ipotesi predefinite della simulazione TFM (modificabili per ogni amministratore)
tfm:
  percentuale: 0.0741          # 1/13,5 del compenso: riferimento prudenziale usato nella prassi
  rendimento_polizza: 0.025
  ires: 0.24
  aliquota_marginale: 0.45     # IRPEF 43% + addizionali, indicativa
  aliquota_separata: 0.33      # stima dell'aliquota media della tassazione separata: da verificare
  contributi_gs: 0.35          # Gestione separata INPS sul compenso (2/3 società, 1/3 amministratore), indicativa
  contributi_tfm: 0.0          # contributi sul TFM: verifica con il consulente

# Rischi: parametri per il fabbisogno di copertura
rischi:
  anni_sostituzione_persona_chiave: 2
  multiplo_ebitda_valutazione: 5   # valore indicativo dell'azienda = multiplo × EBITDA − PFN

scadenze:
  giorni_approvazione_bilancio: 120
  giorni_preavviso: 60
